# Drop-in de docker.service. Enlazado desde
# /etc/systemd/system/docker.service.d/after-tailscaled.conf
#
# AdGuard (network_mode: host) bindea el 53 en la IP de Tailscale del
# servidor, que no existe hasta que tailscaled levanta tailscale0. Si Docker
# arranca antes, AdGuard no puede bindear y sale. Ver docs/decisiones.md §13.
[Unit]
After=tailscaled.service
